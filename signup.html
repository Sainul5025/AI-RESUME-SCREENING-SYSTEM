<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign Up — AI Resume Screening & Job Recommendation System">
  <title>Create Account — ResumeAI</title>

  <!-- Google Fonts — Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- AOS Animation Library -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-auth">

  <!-- Navigation -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-glass fixed-top" id="mainNavbar">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <span class="brand-icon"><i class="fas fa-brain"></i></span>
          <span class="brand-text">Resume<span class="text-gradient">AI</span></span>
        </a>
        <div class="d-flex align-items-center gap-2">
          <a href="login.html" class="btn btn-outline-light btn-sm btn-modern">Sign In</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Signup Main Content -->
  <main class="auth-section min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="hero-bg-gradient"></div>
    <div class="hero-grid-overlay"></div>

    <div class="container position-relative mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5" data-aos="zoom-in" data-aos-duration="800">
          
          <div class="hover-card p-4 p-md-5 auth-card">
            <div class="text-center mb-4">
              <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 24px;">
                <i class="fas fa-user-plus"></i>
              </div>
              <h3 class="fw-bold mb-1">Create an Account</h3>
              <p class="text-muted small">Start analyzing resumes with advanced AI</p>
            </div>

            <!-- Dynamic Alert Area -->
            <div id="signupAlert" class="alert d-none" role="alert"></div>

            <form id="signupForm" novalidate>
              <div class="mb-3">
                <label for="signupName" class="form-label text-muted small fw-semibold">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text border-end-0 bg-transparent text-muted"><i class="fas fa-user"></i></span>
                  <input type="text" class="form-control border-start-0 ps-0" id="signupName" placeholder=" John Doe" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="signupEmail" class="form-label text-muted small fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text border-end-0 bg-transparent text-muted"><i class="fas fa-envelope"></i></span>
                  <input type="email" class="form-control border-start-0 ps-0" id="signupEmail" placeholder=" john@company.com" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="signupPassword" class="form-label text-muted small fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text border-end-0 bg-transparent text-muted"><i class="fas fa-key"></i></span>
                  <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="signupPassword" placeholder=" Minimum 6 characters" required>
                  <button class="btn btn-outline-secondary border-start-0 toggle-password" type="button" data-target="signupPassword">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <!-- Password Strength Meter -->
                <div class="progress mt-2" style="height: 4px;">
                  <div class="progress-bar" id="passwordStrengthBar" role="progressbar" style="width: 0%"></div>
                </div>
                <div class="d-flex justify-content-end">
                  <small id="passwordStrengthText" class="text-muted" style="font-size: 11px;"></small>
                </div>
              </div>

              <div class="mb-4">
                <label for="signupConfirmPassword" class="form-label text-muted small fw-semibold">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text border-end-0 bg-transparent text-muted"><i class="fas fa-check-double"></i></span>
                  <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="signupConfirmPassword" placeholder=" Re-enter password" required>
                  <button class="btn btn-outline-secondary border-start-0 toggle-password" type="button" data-target="signupConfirmPassword">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-primary btn-modern btn-gradient w-100 py-2 fw-semibold" id="signupSubmitBtn" data-default-text="Create Account">
                <span class="spinner-border spinner-border-sm me-2 d-none" id="signupSpinner" role="status" aria-hidden="true"></span>
                <span id="signupBtnText">Create Account</span>
              </button>
            </form>

            <div class="text-center mt-4">
              <p class="small text-muted mb-0">
                Already have an account? <a href="login.html" class="fw-semibold text-gradient text-decoration-none">Sign In</a>
              </p>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer py-4">
    <div class="container text-center">
      <p class="footer-copyright mb-0 small text-muted">
        &copy; 2026 ResumeAI. All rights reserved.
      </p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init({ duration: 800, once: true });</script>
  <script src="auth.js"></script>
</body>
</html>
